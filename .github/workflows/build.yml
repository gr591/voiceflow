name: Build VoiceFlow

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Windows ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Download whisper + piper binaries (Windows)
        shell: pwsh
        run: |
          $bin = "src-tauri\binaries"
          New-Item -Force -ItemType Directory $bin | Out-Null

          # whisper.cpp — Windows CPU x64
          $rel = (Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest").assets |
                  Where-Object { $_.name -match "win-x64\.zip$" } | Select-Object -First 1
          if ($rel) {
            Invoke-WebRequest $rel.browser_download_url -OutFile "$env:TEMP\whisper.zip" -UseBasicParsing
            Expand-Archive "$env:TEMP\whisper.zip" "$env:TEMP\whisper-extract" -Force
            Copy-Item "$env:TEMP\whisper-extract\*" $bin -Recurse -Force
          }

          # ggml-base.bin model (whisper)
          if (-not (Test-Path "$bin\ggml-base.bin")) {
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" `
              -OutFile "$bin\ggml-base.bin" -UseBasicParsing
          }

          # piper — Windows
          $prel = (Invoke-RestMethod "https://api.github.com/repos/rhasspy/piper/releases/latest").assets |
                   Where-Object { $_.name -match "windows_amd64\.zip$" } | Select-Object -First 1
          if ($prel) {
            Invoke-WebRequest $prel.browser_download_url -OutFile "$env:TEMP\piper.zip" -UseBasicParsing
            Expand-Archive "$env:TEMP\piper.zip" "$env:TEMP\piper-extract" -Force
            Copy-Item "$env:TEMP\piper-extract\piper\*" $bin -Recurse -Force
          }

          # piper voice model
          New-Item -Force -ItemType Directory "$bin\voices" | Out-Null
          Invoke-WebRequest "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx" `
            -OutFile "$bin\voices\en_US-ryan-high.onnx" -UseBasicParsing
          Invoke-WebRequest "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx.json" `
            -OutFile "$bin\voices\en_US-ryan-high.onnx.json" -UseBasicParsing

      - name: Download llama-server + LFM model (Windows)
        shell: pwsh
        run: |
          $llamaDir  = "src-tauri\binaries\llama"
          $modelsDir = "src-tauri\binaries\models"
          New-Item -Force -ItemType Directory $llamaDir  | Out-Null
          New-Item -Force -ItemType Directory $modelsDir | Out-Null

          # llama-server Windows CPU
          $rel = (Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest").assets |
                  Where-Object { $_.name -match "win-cpu-x64\.zip$" } | Select-Object -First 1
          if ($rel) {
            Invoke-WebRequest $rel.browser_download_url -OutFile "$env:TEMP\llama.zip" -UseBasicParsing
            Expand-Archive "$env:TEMP\llama.zip" "$env:TEMP\llama-extract" -Force
            Get-ChildItem "$env:TEMP\llama-extract" -Recurse |
              Where-Object { $_.Name -match "^(llama-server|llama|ggml.*|.*\.dll)$" -and -not $_.PSIsContainer } |
              ForEach-Object { Copy-Item $_.FullName $llamaDir -Force }
          }

          # LFM2.5-350M model
          $model = "$modelsDir\LFM2.5-350M-Q8_0.gguf"
          if (-not (Test-Path $model)) {
            (New-Object System.Net.WebClient).DownloadFile(
              "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/main/LFM2.5-350M-Q8_0.gguf",
              $model
            )
          }

      - name: Build NSIS installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Download macOS binaries
        run: bash scripts/download-binaries-mac.sh
        env:
          # Higher GitHub API rate limit for asset URL lookups
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS app bundle (Universal)
        # Build the .app first (not DMG) so we can patch Info.plist before packaging.
        # NSMicrophoneUsageDescription cannot be set via tauri.conf.json in Tauri v2
        # and must be injected after the bundle is generated.
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles app --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Patch NSMicrophoneUsageDescription into Info.plist
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          echo "Patching: $APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string 'VoiceFlow needs microphone access to transcribe your speech.'" \
            "$APP/Contents/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :NSMicrophoneUsageDescription 'VoiceFlow needs microphone access to transcribe your speech.'" \
            "$APP/Contents/Info.plist"

      - name: Package DMG
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          # Strip quarantine flags from all files inside the bundle.
          # Without this, macOS blocks execution of sidecar binaries
          # (whisper-cli, piper, llama-server) even inside an app the
          # user has already opened via right-click → Open.
          xattr -cr "$APP"
          hdiutil create \
            -volname "VoiceFlow" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "VoiceFlow.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-macOS
          path: VoiceFlow.dmg

  # ── Release (runs only on version tags) ─────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VoiceFlow-Windows/*.exe
            artifacts/VoiceFlow-macOS/*.dmg
          generate_release_notes: true
